<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pong Classique</title>
    <style>
      :root {
        color-scheme: dark light;
        font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      body {
        margin: 0;
        background: radial-gradient(circle at top, #222 0, #111 60%, #000 100%);
        color: #f0f0f0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        gap: 1.5rem;
      }

      h1 {
        font-size: clamp(1.8rem, 3vw, 3rem);
        margin: 0.5rem 0 0;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      #pong {
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
        border: 4px solid rgba(255, 255, 255, 0.5);
        border-radius: 12px;
        background: linear-gradient(180deg, rgba(20, 20, 20, 0.95), rgba(10, 10, 10, 0.95));
      }

      .scoreboard {
        display: flex;
        gap: 2rem;
        font-size: 1.4rem;
        font-weight: 600;
        letter-spacing: 0.06em;
      }

      .instructions {
        max-width: min(90vw, 480px);
        text-align: center;
        font-size: 0.95rem;
        color: rgba(240, 240, 240, 0.75);
        line-height: 1.5;
      }

      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Pong</h1>
      <canvas id="pong" width="800" height="500" aria-label="Jeu de Pong"></canvas>
      <div class="scoreboard">
        <span>Joueur 1: <span id="score-left">0</span></span>
        <span>Joueur 2: <span id="score-right">0</span></span>
      </div>
      <p class="instructions">
        Contrôles : <strong>W</strong>/<strong>S</strong> pour le joueur 1, <strong>↑</strong>/<strong>↓</strong>
        pour le joueur 2. Appuyez sur <strong>Barre d'espace</strong> pour mettre en pause ou
        reprendre la partie.
      </p>
    </main>
    <script>
      const canvas = document.getElementById("pong");
      const ctx = canvas.getContext("2d");
      const scoreLeftEl = document.getElementById("score-left");
      const scoreRightEl = document.getElementById("score-right");

      const WIDTH = canvas.width;
      const HEIGHT = canvas.height;

      const paddleWidth = 16;
      const paddleHeight = 100;
      const ballRadius = 12;

      const paddleSpeed = 7;
      const ballSpeed = 5.4;
      const maxBounceAngle = (Math.PI / 180) * 75;

      const state = {
        leftPaddle: HEIGHT / 2 - paddleHeight / 2,
        rightPaddle: HEIGHT / 2 - paddleHeight / 2,
        ballX: WIDTH / 2,
        ballY: HEIGHT / 2,
        ballVelX: ballSpeed,
        ballVelY: ballSpeed / 2,
        scoreLeft: 0,
        scoreRight: 0,
        paused: false,
        pressedKeys: new Set(),
      };

      function resetBall(direction = 1) {
        state.ballX = WIDTH / 2;
        state.ballY = HEIGHT / 2;
        const angle = (Math.random() - 0.5) * maxBounceAngle;
        state.ballVelX = Math.cos(angle) * ballSpeed * direction;
        state.ballVelY = Math.sin(angle) * ballSpeed;
      }

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function updatePaddles() {
        if (state.pressedKeys.has("KeyW")) {
          state.leftPaddle -= paddleSpeed;
        }
        if (state.pressedKeys.has("KeyS")) {
          state.leftPaddle += paddleSpeed;
        }
        if (state.pressedKeys.has("ArrowUp")) {
          state.rightPaddle -= paddleSpeed;
        }
        if (state.pressedKeys.has("ArrowDown")) {
          state.rightPaddle += paddleSpeed;
        }
        state.leftPaddle = clamp(state.leftPaddle, 0, HEIGHT - paddleHeight);
        state.rightPaddle = clamp(state.rightPaddle, 0, HEIGHT - paddleHeight);
      }

      function updateBall() {
        state.ballX += state.ballVelX;
        state.ballY += state.ballVelY;

        if (state.ballY - ballRadius <= 0 || state.ballY + ballRadius >= HEIGHT) {
          state.ballVelY *= -1;
          state.ballY = clamp(state.ballY, ballRadius, HEIGHT - ballRadius);
        }

        const paddleCollision = (paddleX, paddleY) => {
          const withinY = state.ballY > paddleY && state.ballY < paddleY + paddleHeight;
          const withinX =
            state.ballX + ballRadius > paddleX &&
            state.ballX - ballRadius < paddleX + paddleWidth;
          return withinX && withinY;
        };

        // Collision with left paddle
        if (state.ballVelX < 0 && paddleCollision(0, state.leftPaddle)) {
          const relativeIntersectY = state.ballY - (state.leftPaddle + paddleHeight / 2);
          const normalized = relativeIntersectY / (paddleHeight / 2);
          const bounceAngle = normalized * maxBounceAngle;
          state.ballVelX = Math.cos(bounceAngle) * ballSpeed;
          state.ballVelY = Math.sin(bounceAngle) * ballSpeed;
          state.ballX = paddleWidth + ballRadius;
        }

        // Collision with right paddle
        if (state.ballVelX > 0 && paddleCollision(WIDTH - paddleWidth, state.rightPaddle)) {
          const relativeIntersectY = state.ballY - (state.rightPaddle + paddleHeight / 2);
          const normalized = relativeIntersectY / (paddleHeight / 2);
          const bounceAngle = normalized * maxBounceAngle;
          state.ballVelX = -Math.cos(bounceAngle) * ballSpeed;
          state.ballVelY = Math.sin(bounceAngle) * ballSpeed;
          state.ballX = WIDTH - paddleWidth - ballRadius;
        }

        if (state.ballX < 0) {
          state.scoreRight += 1;
          scoreRightEl.textContent = state.scoreRight;
          resetBall(1);
        } else if (state.ballX > WIDTH) {
          state.scoreLeft += 1;
          scoreLeftEl.textContent = state.scoreLeft;
          resetBall(-1);
        }
      }

      function drawNet() {
        const segmentHeight = 20;
        const gap = 15;
        ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
        for (let y = 0; y < HEIGHT; y += segmentHeight + gap) {
          ctx.fillRect(WIDTH / 2 - 2, y, 4, segmentHeight);
        }
      }

      function render() {
        ctx.clearRect(0, 0, WIDTH, HEIGHT);

        drawNet();

        ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
        ctx.fillRect(0, state.leftPaddle, paddleWidth, paddleHeight);
        ctx.fillRect(WIDTH - paddleWidth, state.rightPaddle, paddleWidth, paddleHeight);

        ctx.beginPath();
        ctx.arc(state.ballX, state.ballY, ballRadius, 0, Math.PI * 2);
        ctx.fill();
      }

      function loop() {
        if (!state.paused) {
          updatePaddles();
          updateBall();
        }
        render();
        requestAnimationFrame(loop);
      }

      window.addEventListener("keydown", (event) => {
        if (event.code === "Space") {
          state.paused = !state.paused;
          return;
        }
        state.pressedKeys.add(event.code);
      });

      window.addEventListener("keyup", (event) => {
        state.pressedKeys.delete(event.code);
      });

      resetBall();
      loop();
    </script>
  </body>
</html>
